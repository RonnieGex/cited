<div class="page">
  <div class="head">
    <div class="eyebrow">See it answer</div>
    <div class="headline">Ask a question. Get the passage and where it came from.</div>
  </div>
  <div class="terminal">
    <div class="bar">
      <span class="light light-a"></span>
      <span class="light"></span>
      <span class="light"></span>
      <span class="bar-title">cited · quick start</span>
    </div>
    <div class="screen">
      <div class="line prompt"><span class="sign">$</span>{{INGEST_COMMAND}}</div>
      <div class="line">{{INGEST_OUTPUT}}</div>
      <div class="line prompt"><span class="sign">$</span>{{SEARCH_COMMAND}}</div>
      <div class="line">{{SEARCH_BEFORE}}</div>
      <div class="line hit">{{SEARCH_HIT}}</div>
      <div class="line">{{SEARCH_AFTER}}</div>
    </div>
  </div>
</div>
