<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Cited graphic, {{THEME}}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" />
    <style>
      :root {
        color-scheme: {{THEME}};
        --hairline: {{HAIRLINE}};
        --panel: {{PANEL}};
        --panel-strong: {{PANEL_STRONG}};
        --header: {{HEADER}};
        --muted-soft: {{MUTED_SOFT}};
        --mark-outline: {{MARK_OUTLINE}};
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: {{WIDTH}}px;
        height: {{HEIGHT}}px;
      }
      body {
        position: relative;
        overflow: hidden;
        background: {{BACKGROUND}};
        color: {{TEXT}};
        font-family: Outfit, "Segoe UI", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .tone {
        position: absolute;
        inset: 0;
        background: radial-gradient(620px 260px at 12% 0%, {{GLOW}}, transparent 70%);
      }
      .frame {
        position: absolute;
        inset: 0;
        border: 1px solid {{HAIRLINE}};
      }
      .next {
        display: inline-block;
        padding: 3px 12px 2px;
        border-radius: 999px;
        background: {{NEXT_BACKGROUND}};
        color: {{NEXT_TEXT}};
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      .eyebrow {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: {{MUTED}};
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: {{DOT}};
        display: inline-block;
      }
      {{STYLES}}
    </style>
  </head>
  <body>
    <div class="tone"></div>
    <div class="frame"></div>
    {{CONTENT}}
  </body>
</html>
